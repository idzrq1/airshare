<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AirShare</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Socket.IO من CDN -->
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="container">

        <!-- ===================== العنوان ===================== -->
        <header class="header">
            <h1 class="logo">AirShare</h1>
            <div class="device-name-box">
                <label>اسم جهازي:</label>
                <input id="deviceNameInput" type="text" placeholder="اسم الجهاز" />
            </div>
            <div id="connectionStatus" class="status disconnected">• غير متصل</div>
        </header>

        <!-- ===================== قسم رفع الملفات ===================== -->
        <section class="upload-section">
            <h2>ارفع ملف</h2>

            <div id="dropzone" class="dropzone">
                <p>اسحب الملف هنا أو</p>
                <button id="browseBtn" class="primary-btn">اختر ملف</button>
                <input type="file" id="fileInput" hidden />
            </div>

            <div id="fileStatus" class="file-status" style="display: none;">
                <span id="fileName"></span><br>
                <span id="fileSize"></span>
            </div>

            <div id="messageArea" class="message"></div>
        </section>

        <!-- ===================== الأجهزة ===================== -->
        <section class="peers-section">
            <h2>الأجهزة المتصلة</h2>
            <ul id="peerList" class="peer-list"></ul>
        </section>

        <!-- ===================== الملفات الواردة ===================== -->
        <section class="inbox-section">
            <h2>الملفات الواردة</h2>

            <div id="inbox" class="inbox">
                <div class="empty-inbox">لا توجد ملفات مستلمة.</div>
            </div>
        </section>

    </div>

    <!-- سكربت الواجهة -->
    <script src="app.js"></script>

</body>
</html>
