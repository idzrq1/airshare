<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AirShare - مشاركة عبر الواي فاي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="main-container">
    <!-- منطقة رفع / اختيار الملف -->
    <div class="upload-area">
      <h1>AirShare</h1>
      <p class="subtitle">شارك الملفات مع الأجهزة في نفس الشبكة</p>

      <div id="dropzone" class="dropzone">
        <div class="drop-inner">
          <div class="icon">📤</div>
          <p><strong>اسحب الملف هنا</strong></p>
          <p class="or">أو</p>
          <button id="browseBtn" class="primary-btn">تصفح الملفات</button>
          <input type="file" id="fileInput" style="display: none" />
        </div>
      </div>

      <div id="fileStatus" class="file-status" style="display: none;">
        <div class="file-info">
          <span id="fileName"></span>
          <span id="fileSize"></span>
        </div>
        <p class="hint">اختر جهاز من القائمة على اليمين لإرسال هذا الملف إليه.</p>
      </div>

      <p id="messageArea" class="message"></p>
    </div>

    <!-- منطقة الأجهزة القريبة / الملفات الواردة -->
    <div class="peers-area">
      <h2>الأجهزة القريبة</h2>

      <div class="name-input-area">
        <label for="deviceNameInput">اسم جهازي:</label>
        <input type="text" id="deviceNameInput" placeholder="مثلاً: لابتوب الصالة" />
      </div>

      <div id="connectionStatus" class="connection-status disconnected">
        • جاري الاتصال بالسيرفر...
      </div>

      <ul id="peerList" class="peer-list">
        <li class="empty-state">لا توجد أجهزة قريبة حالياً.</li>
      </ul>

      <h3 class="inbox-title">الملفات الواردة</h3>
      <div id="inbox" class="inbox">
        <p class="empty-inbox">لا توجد ملفات مستلمة بعد.</p>
      </div>
    </div>
  </div>

  <!-- Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- منطق الواجهة -->
  <script src="app.js"></script>
</body>
</html>
